name: Build iOS IPA from Godot Source (4.6, Auto Version)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Download Godot 4.6 CLI (macOS, standard version)
      - name: Download Godot CLI
        run: |
          curl -Lo godot.zip https://downloads.tuxfamily.org/godotengine/4.6/Godot_v4.6-stable_macos_universal.zip
          unzip godot.zip -d godot
          chmod +x godot/Godot.app/Contents/MacOS/Godot
          echo "GODOT_CLI=$(pwd)/godot/Godot.app/Contents/MacOS/Godot" >> $GITHUB_ENV

      # 3️⃣ Generate IPA name from project.godot
      - name: Generate IPA name from project.godot
        run: |
          GAME_NAME=$(grep '^name=' project.godot | sed 's/name=//;s/"//g')
          GAME_VERSION=$(grep '^version=' project.godot | sed 's/version=//;s/"//g')
          BUILD=$(date +%Y%m%d%H%M)
          IPA_NAME="${GAME_NAME}-${GAME_VERSION}-${BUILD}.ipa"
          echo "GAME_NAME=$GAME_NAME" >> $GITHUB_ENV
          echo "GAME_VERSION=$GAME_VERSION" >> $GITHUB_ENV
          echo "BUILD=$BUILD" >> $GITHUB_ENV
          echo "IPA_NAME=$IPA_NAME" >> $GITHUB_ENV
          echo "Using IPA name $IPA_NAME"

      # 4️⃣ Export iOS project (Xcode project)
      - name: Export iOS project
        run: |
          mkdir -p build/ios
          $GODOT_CLI --headless --export "iOS" build/ios

      # 5️⃣ Update Info.plist with version/build
      - name: Update Info.plist
        run: |
          APP_NAME=$(ls build/ios/*.xcodeproj | sed 's/\.xcodeproj//')
          INFO_PLIST="build/ios/$APP_NAME/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $GAME_VERSION" "$INFO_PLIST" || \
          /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string $GAME_VERSION" "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD" "$INFO_PLIST" || \
          /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $BUILD" "$INFO_PLIST"

      # 6️⃣ Build Xcode project (unsigned)
      - name: Build Xcode project
        run: |
          APP_NAME=$(ls build/ios/*.xcodeproj | sed 's/\.xcodeproj//')
          xcodebuild \
            -project "build/ios/$APP_NAME.xcodeproj" \
            -scheme "$APP_NAME" \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      # 7️⃣ Package IPA
      - name: Package IPA
        run: |
          mkdir -p build/ipa/Payload
          APP_PATH=$(find build/ios/build -name "*.app" | head -n 1)
          cp -r "$APP_PATH" build/ipa/Payload/
          cd build/ipa
          zip -r "$IPA_NAME" Payload
          cd ../..

      # 8️⃣ Upload IPA as Artifact
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/ipa/$IPA_NAME
